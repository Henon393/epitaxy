[project]
name = "facturation"
version = "0.1.0"
description = "SaaS de facturation électronique (Solution Compatible) — projet d'apprentissage"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "factur-x>=3.1",
    # Sans saxonche, factur-x SAUTE la validation Schematron en silence —
    # inacceptable : la validation est systématique (CLAUDE.md).
    "saxonche>=12",
    # Template du PDF lisible (le rendu WeasyPrint tourne en conteneur).
    "jinja2>=3.1",
    # Contrôles de structure Factur-X sur le PDF produit (déjà tiré par
    # factur-x, déclaré car importé directement).
    "pypdf>=4",
    "pyjwt>=2.8",
    "redis>=5.0",
    # Worker de polling PA (plus léger que Celery, Retry avec backoff
    # intégré, pas de beat à opérer) — prévu par le CLAUDE.md dès l'origine.
    "rq>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
