    </g>
    <g filter="url(#e-ombre2)" transform="translate(56.9 45.1) scale(0.62) rotate(-25 5 95)">
      <path d="M 5 95 C 17 51 51 17 95 5 C 83 49 49 83 5 95 Z" fill="url(#e-rouge)"></path>
      <path d="M 5 95 C 17 51 51 17 95 5 C 83 49 49 83 5 95 Z" fill="url(#e-satin)"></path>
    </g>
</svg>