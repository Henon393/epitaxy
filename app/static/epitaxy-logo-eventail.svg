<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="epitaxy — logo éventail" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>epitaxy — logo éventail</title>
  <desc>Trois amandes en éventail depuis une base commune, teintes délavées bleu, ivoire et rouge. Fond transparent.</desc>
  <defs>
    <linearGradient id="e-bleu" x1="0.05" y1="0.95" x2="0.95" y2="0.05"><stop offset="0%" stop-color="#7c99b8"></stop><stop offset="52%" stop-color="#9ab1c9"></stop><stop offset="100%" stop-color="#bccddd"></stop></linearGradient>
    <linearGradient id="e-ivoire" x1="0.05" y1="0.95" x2="0.95" y2="0.05"><stop offset="0%" stop-color="#e2e3db"></stop><stop offset="52%" stop-color="#f3f3ef"></stop><stop offset="100%" stop-color="#fdfdfb"></stop></linearGradient>
    <linearGradient id="e-rouge" x1="0.05" y1="0.95" x2="0.95" y2="0.05"><stop offset="0%" stop-color="#b9837d"></stop><stop offset="52%" stop-color="#cf9b95"></stop><stop offset="100%" stop-color="#e0b3ad"></stop></linearGradient>
    <linearGradient id="e-satin" x1="0" y1="0" x2="0.45" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"></stop><stop offset="48%" stop-color="#ffffff" stop-opacity="0.08"></stop><stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop></linearGradient>
    <filter id="e-ombre1" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="-0.5" dy="0.8" stdDeviation="1.1" flood-color="#2c3f4e" flood-opacity="0.13"></feDropShadow></filter>
    <filter id="e-ombre2" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="-0.9" dy="1.3" stdDeviation="1.7" flood-color="#2c3f4e" flood-opacity="0.2"></feDropShadow></filter>
  </defs>
    <g filter="url(#e-ombre1)" transform="translate(56.9 45.1) scale(0.62) rotate(-65 5 95)">
      <path d="M 5 95 C 17 51 51 17 95 5 C 83 49 49 83 5 95 Z" fill="url(#e-bleu)"></path>
      <path d="M 5 95 C 17 51 51 17 95 5 C 83 49 49 83 5 95 Z" fill="url(#e-satin)"></path>
    </g>
    <g filter="url(#e-ombre2)" transform="translate(56.9 45.1) scale(0.62) rotate(-45 5 95)">
      <path d="M 5 95 C 17 51 51 17 95 5 C 83 49 49 83 5 95 Z" fill="url(#e-ivoire)" stroke="rgba(52,68,80,0.09)" stroke-width="1.2"></path>
